<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>게임 도움말 UI</title>
  <style>
    /* Unity로 옮길 때 참고할 공통 값 */
    :root {
      --app-bg: #edf0f2;
      --window-bg: #ffffff;
      --sidebar-bg: #f6f7f9;
      --text: #20262d;
      --muted: #687582;
      --line: #dce2e7;
      --accent: #366cba;
      --selected-bg: #e4efff;
      --note-bg: #f4f7fa;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 28px;
      background: var(--app-bg);
      color: var(--text);
      font-family: Arial, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      font-size: 15px;
      line-height: 1.65;
    }

    /* 하나의 도움말 창 */
    .help-window {
      width: min(1160px, 100%);
      height: min(760px, calc(100vh - 56px));
      min-height: 350px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #cbd3db;
      border-radius: 12px;
      background: var(--window-bg);
      box-shadow: 0 22px 55px rgba(23, 37, 54, 0.11);
    }

    .window-title {
      flex: 0 0 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 34px;
      border-bottom: 1px solid var(--line);
    }
    .window-title h1 { margin: 0; font-size: 22px; font-weight: 750; letter-spacing: -0.7px; }
    .window-title p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .window-type { color: #8b97a2; font-size: 11px; font-weight: 700; letter-spacing: 2px; }

    /* 제목을 제외한 영역은 좌우 2열 */
    .help-body {
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr);
      min-height: 0; /* 중요: ScrollRect처럼 각 패널이 내부 스크롤되게 함 */
      flex: 1;
    }
    .topic-pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--line);
    }
    .pane-heading {
      flex: 0 0 auto;
      padding: 23px 20px 13px;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 1px;
      color: var(--muted);
    }
    .topic-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;  /* 왼쪽 스크롤: 독립 */
      padding: 0 11px 22px;
      scrollbar-width: thin;
      scrollbar-color: #b5bfc9 transparent;
    }
    .topic-button {
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      margin: 2px 0;
      padding: 13px 12px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #35414d;
      text-align: left;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .topic-button:hover { background: #e9edf2; }
    .topic-button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .topic-button[aria-current="true"] {
      background: var(--selected-bg);
      color: #235aab;
      font-weight: 750;
    }
    .topic-index { width: 21px; flex: 0 0 21px; font-size: 11px; color: #99a4af; font-weight: 700; }
    .topic-button[aria-current="true"] .topic-index { color: var(--accent); }
    .topic-count {
      flex: 0 0 52px;
      display: flex;
      align-items: center;
      padding: 0 23px;
      border-top: 1px solid var(--line);
      color: #8a97a4;
      font-size: 12px;
    }

    .article-scroll {
      min-height: 0;
      overflow-y: auto; /* 오른쪽 스크롤: 왼쪽에 영향 없음 */
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: #b5bfc9 transparent;
    }
    .article-content { max-width: 800px; padding: 44px 58px 70px; }
    .article-overline { margin: 0 0 12px; color: var(--accent); font-size: 12px; letter-spacing: 1px; font-weight: 800; }
    .article-title { margin: 0 0 15px; font-size: clamp(26px, 2.9vw, 36px); line-height: 1.25; letter-spacing: -1.2px; }
    .article-summary { margin: 0; max-width: 680px; color: #5c6975; font-size: 16px; line-height: 1.9; }
    .article-divider { margin: 28px 0 34px; height: 1px; background: var(--line); }
    .article-section { margin: 0 0 35px; }
    .article-section h3 { margin: 0 0 12px; font-size: 18px; line-height: 1.5; letter-spacing: -0.5px; }
    .article-section p { margin: 0 0 12px; color: #48535e; line-height: 1.9; }
    .article-section ul { margin: 14px 0 0; padding-left: 23px; color: #48535e; }
    .article-section li { margin-bottom: 10px; padding-left: 3px; line-height: 1.8; }
    .article-note {
      margin-top: 12px;
      padding: 17px 19px;
      border-left: 3px solid #91aac7;
      border-radius: 0 6px 6px 0;
      background: var(--note-bg);
      font-size: 14px;
      color: #536170;
    }
    .article-note strong { display: block; margin-bottom: 4px; color: #334254; }

    @media (max-width: 650px) {
      body { padding: 0; }
      .help-window { width: 100%; height: 100dvh; border: 0; border-radius: 0; }
      .window-title { flex-basis: 64px; padding: 0 18px; }
      .window-title h1 { font-size: 18px; }
      .window-type { display: none; }
      .help-body { grid-template-columns: minmax(133px, 36%) minmax(0, 1fr); }
      .pane-heading { padding: 15px 11px 10px; }
      .topic-list { padding: 0 5px 15px; }
      .topic-button { gap: 6px; padding: 12px 7px; font-size: 12px; }
      .topic-index { width: 17px; flex-basis: 17px; font-size: 10px; }
      .topic-count { padding: 0 12px; }
      .article-content { padding: 27px 20px 55px; }
      .article-title { font-size: 25px; }
      .article-summary { font-size: 14px; }
      .article-section h3 { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main class="help-window" aria-label="게임 도움말 창">
    <header class="window-title">
      <div>
        <h1>게임 도움말</h1>
        <p>규칙과 시스템을 항목별로 확인할 수 있습니다.</p>
      </div>
      <span class="window-type">HELP / GUIDE</span>
    </header>

    <div class="help-body">
      <nav class="topic-pane" aria-label="도움말 항목">
        <div class="pane-heading">도움말 목차</div>
        <div class="topic-list" id="topicList"></div>
        <div class="topic-count" id="topicCount"></div>
      </nav>

      <section class="article-scroll" id="articleScroll" aria-label="선택한 항목 설명" tabindex="0">
        <article class="article-content" id="articleContent" aria-live="polite"></article>
      </section>
    </div>
  </main>

          { heading: "결과 적용", body: "선택한 행동의 결과는 즉시 반영되거나 이후 진행에 영향을 줄 수 있습니다." }

          { heading: "도움말 사용", body: "왼쪽 목록에서 항목을 고르면 오른쪽 설명이 바뀝니다. 두 영역은 서로 영향을 주지 않고 각각 스크롤됩니다." }

        summary: "처음 플레이할 때 혼동하기 쉬운 내용을 정리했습니다.",
        sections: [
          { heading: "행동이 실행되지 않아요", body: "자원이 충분한지, 유효한 대상을 선택했는지, 현재 단계에서 허용된 행동인지 확인합니다." },
          { heading: "효과가 예상과 달라요", body: "조건부 발동 효과, 중첩 제한, 우선순위 규칙을 순서대로 확인합니다." },
          { heading: "어떤 항목부터 읽으면 좋나요?", body: "게임 기본 흐름, 턴과 행동 순서, 자원과 비용, 카드와 능력 사용 항목부터 살펴보면 전체 구조를 이해하기 쉽습니다." }

    const topicList = document.getElementById("topicList");
    const topicCount = document.getElementById("topicCount");
    const articleContent = document.getElementById("articleContent");
    const articleScroll = document.getElementById("articleScroll");
    const buttons = new Map();

    // 단순한 텍스트 생성 함수: 유니티의 TMP_Text에 각각 대응시키기 쉬운 구성
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function selectTopic(id) {
      const topic = helpTopics.find(item => item.id === id);
      if (!topic) return;

      for (const [key, button] of buttons) {
        const selected = key === id;
        button.setAttribute("aria-current", String(selected));
      }

      articleContent.replaceChildren();
      articleContent.appendChild(el("p", "article-overline", topic.category));
      articleContent.appendChild(el("h2", "article-title", topic.title));
      articleContent.appendChild(el("p", "article-summary", topic.summary));
      articleContent.appendChild(el("div", "article-divider"));

      topic.sections.forEach(section => {
        const wrapper = el("section", "article-section");
        wrapper.appendChild(el("h3", "", section.heading));
        wrapper.appendChild(el("p", "", section.body));
        if (section.bullets && section.bullets.length) {
          const ul = el("ul");
          section.bullets.forEach(line => ul.appendChild(el("li", "", line)));
          wrapper.appendChild(ul);
        }
        articleContent.appendChild(wrapper);
      });
      if (topic.note) {
        const note = el("div", "article-note");
        note.appendChild(el("strong", "", "참고"));
        note.appendChild(el("span", "", topic.note));
        articleContent.appendChild(note);
      }
      articleScroll.scrollTop = 0; // 항목 선택 시 오른쪽만 맨 위로. 왼쪽 스크롤 위치는 유지.
    }

    // 목록 버튼은 최초 1회만 구성하고, 클릭 시 오른쪽 내용만 교체합니다.
    helpTopics.forEach((topic, index) => {
      const button = el("button", "topic-button");
      button.type = "button";
      button.appendChild(el("span", "topic-index", String(index + 1).padStart(2, "0")));
      button.appendChild(el("span", "", topic.title));
      button.addEventListener("click", () => selectTopic(topic.id));
      topicList.appendChild(button);
      buttons.set(topic.id, button);
    });
    topicCount.textContent = `전체 ${helpTopics.length}개 항목`;
    selectTopic(helpTopics[0].id);
  </script>
