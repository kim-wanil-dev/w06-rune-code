<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>룬 코드 테이블 편집기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>룬 코드 테이블 편집기</h1>
  <span id="table-title" class="table-title"></span>
  <span id="dirty-mark" class="dirty-mark" hidden>● 변경됨</span>
  <span class="spacer"></span>
  <span id="error-summary" class="error-summary"></span>
  <button id="btn-reload" type="button" title="저장하지 않은 변경을 버리고 파일을 다시 읽습니다.">파일 다시 불러오기</button>
  <button id="btn-save" type="button" disabled>저장</button>
</header>
<div id="layout">
  <nav id="sidebar"></nav>
  <main id="main"></main>
</div>
<footer>
  <details id="error-panel" open>
    <summary>검증 결과 <span id="error-count"></span></summary>
    <div id="error-list"></div>
  </details>
</footer>
<script src="schemas.js"></script>
<script src="app.js"></script>
</body>
</html>
